name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enable the PostgreSQL and Azure Blob Storage (Azurite) integration tests (skipped when unset)
      DOCPROC_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DOCPROC_TEST_AZURITE: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v7

      - name: Start Azurite (Azure Storage emulator)
        # Not a service container: the blob-only command and --skipApiVersionCheck need custom args
        run: >
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite
          azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DocumentProcessing.slnx

      - name: Check for vulnerable packages
        run: |
          dotnet list DocumentProcessing.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

      - name: Build
        run: dotnet build DocumentProcessing.slnx --no-restore -c Release

      - name: Test
        # Microsoft.Testing.Platform runner (see global.json). Coverage settings need an absolute path.
        run: >
          dotnet test --no-build -c Release
          --coverage --coverage-output-format cobertura
          --coverage-settings "$GITHUB_WORKSPACE/tests/DocumentProcessing.Tests/coverage.config.xml"
          --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults

  frontend:
    name: Web lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DocumentProcessing.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/DocumentProcessing.Web/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -t docproc:ci .
